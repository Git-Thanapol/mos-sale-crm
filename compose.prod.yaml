services:
  db:
    environment:
      POSTGRES_INITDB_ARGS: "--data-checksums"
    restart: always

  redis:
    restart: always

  web:
    build:
      args:
        INSTALL_DEV: "false"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_DEBUG: "0"
    restart: always

  worker:
    build:
      args:
        INSTALL_DEV: "false"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    restart: always

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    volumes:
      - ./docker/nginx/crm.conf:/etc/nginx/conf.d/default.conf:ro
      - static:/app/staticfiles:ro
      - media:/app/media:ro
    ports:
      - "8001:80"
    restart: always

volumes:
  static:
  media:
