upstream crm_web {
    server web:8000;
}

server {
    listen 80;
    client_max_body_size 25m;

    # Text compression for HTML/CSS/JS proxied from Django (the dev server and
    # gunicorn do not compress). Static files are also pre-compressed by
    # WhiteNoise's Compressed* storage, but nginx serves /static/ directly.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location /static/ {
        alias /app/staticfiles/;
        # CompressedManifestStaticFilesStorage emits content-hashed filenames,
        # so a changed file always gets a new URL: safe to cache for a year.
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://crm_web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
